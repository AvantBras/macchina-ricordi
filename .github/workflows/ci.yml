name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    # Keep system audio packages on a stable LTS image rather than a moving release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Install base package and development tools only
        run: uv sync --locked --extra dev --python "${{ matrix.python }}"
      - name: Ensure audio dependencies without apt mirrors
        run: |
          # SoundFile's Linux wheels bundle libsndfile. Use an isolated, pinned
          # FFmpeg wheel only if the hosted image does not provide the executable.
          uv run --no-sync python -c 'import soundfile; print("libsndfile", soundfile.__libsndfile_version__)'
          if command -v ffmpeg >/dev/null; then
            ffmpeg -version
          else
            ffmpeg_bin="$(uv run --no-project --with imageio-ffmpeg==0.6.0 python -c \
              'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            mkdir -p "$RUNNER_TEMP/audio-bin"
            ln -s "$ffmpeg_bin" "$RUNNER_TEMP/audio-bin/ffmpeg"
            printf '%s\n' "$RUNNER_TEMP/audio-bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/audio-bin/ffmpeg" -version
          fi
      - name: Run tests
        run: uv run --no-sync --python "${{ matrix.python }}" pytest

  # NOTE: keep this job's name stable. Branch protection may reference it as a
  # required status check, and renaming it can silently drop that requirement.
  # Whether it is actually required is set in repository settings and cannot be
  # verified from CI — the branch-protection API returns 403 on private repos
  # without the required plan.
  checks:
    name: Lint, lockfiles and distributions
    # Keep system audio packages on a stable LTS image rather than a moving release.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Check the root lockfile
        run: uv lock --check
      - name: Install base package and development tools only
        run: uv sync --locked --extra dev
      # Correctness-only lint (Ruff F = Pyflakes, B = flake8-bugbear). Formatting
      # is intentionally not enforced here; see `make format`.
      - name: Ruff lint (correctness)
        run: uv run --no-sync ruff check .
      # Building archives checks packaging, not standalone wheel support.
      # The supported installation remains an editable source checkout.
      - name: Build source and wheel archives
        run: uv build

  # Non-blocking: the MusicGen lockfile is checked in isolation, without the GPU
  # runtime, models or heavy installs, and without a `needs` edge so it never
  # gates or is gated by the required jobs.
  musicgen-lock:
    name: MusicGen lockfile (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Check the MusicGen lockfile without installing the GPU runtime
        run: uv lock --project musicgen --check
