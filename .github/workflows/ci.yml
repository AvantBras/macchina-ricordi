name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    # Keep system audio packages on a stable LTS image rather than a moving release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Ensure audio system dependencies
        run: |
          # Hosted images normally include these. Avoid a network-only apt failure
          # blocking tests when the required tools and shared library already work.
          if command -v ffmpeg >/dev/null && python -c 'import ctypes; ctypes.CDLL("libsndfile.so.1")'; then
            ffmpeg -version
          else
            # Some hosted-image mirror lists still point at the Azure HTTP
            # endpoint, which can time out before tests even start. Use the
            # official Ubuntu archive over HTTPS for those entries only.
            sudo python - <<'PY'
          from pathlib import Path
          paths = [Path("/etc/apt/apt-mirrors.txt"), Path("/etc/apt/sources.list")]
          paths += list(Path("/etc/apt/sources.list.d").glob("*.sources"))
          paths += list(Path("/etc/apt/sources.list.d").glob("*.list"))
          for path in paths:
              if path.is_file():
                  old = path.read_text()
                  new = old.replace("http://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu")
                  if new != old:
                      path.write_text(new)
          PY
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install \
              --yes --no-install-recommends ffmpeg libsndfile1
          fi
      - name: Install base package and development tools only
        run: uv sync --locked --extra dev --python "${{ matrix.python }}"
      - name: Run tests
        run: uv run --no-sync --python "${{ matrix.python }}" pytest

  checks:
    name: Lint, lockfiles and distributions
    # Keep system audio packages on a stable LTS image rather than a moving release.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Check both lockfiles without installing the GPU runtime
        run: |
          uv lock --check
          uv lock --project musicgen --check
      - name: Install base package and development tools only
        run: uv sync --locked --extra dev
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      # Building archives checks packaging, not standalone wheel support.
      # The supported installation remains an editable source checkout.
      - name: Build source and wheel archives
        run: uv build
