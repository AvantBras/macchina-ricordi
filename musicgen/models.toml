# What a model is called and what has been measured about it.
#
# One [models.<sig>] table per model that has something worth saying. Facts training
# already records (shape, dataset, epochs, parents, checkpoints) are read from
# .dora/xps/<sig>/ and do not belong here. See docs/glossary.md and `model --help`.
#
#   name      the model's short name, usable anywhere a model is expected (`model name <ref> <name>`)
#   title     a longer description
#   notes     free text
#   measured  behaviour measured in a study: clean_share (share of candidate takes with no
#             silence), top_k_cliff (top_k at or below which silence spikes)
#   study     architecture recorded by the author's historical model study;
#             `epochs` is the epoch that study played, not the run's total

schema = "macchina_ricordi.models.v1"

